<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><link rel="canonical" href="https://albertoscott.co.uk/albiprime/"><meta name="theme-color" content="#080d14">
<title>Albi Prime</title><meta name="description" content="TV demo clips. 4K, 8K and HDR downloads.">
<link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#library">Skip to clips</a>
<header class="masthead"><a class="brand" href="#library" aria-label="Albi Prime">albi <span>prime</span></a><a class="home-link" href="/">Alberto Scott ↗</a></header>
<main id="library">
<div class="section-heading"><h1>Clips</h1><p id="results" role="status"></p></div>
<div class="toolbar"><div class="filters" role="group" aria-label="Filter clips"><button class="active" aria-pressed="true" data-filter="all">All demos</button><button aria-pressed="false" data-filter="4k">4K</button><button aria-pressed="false" data-filter="8k">8K</button><button aria-pressed="false" data-filter="hdr">HDR</button><button aria-pressed="false" data-filter="60fps">60 fps</button></div><label class="search"><span class="sr-only">Search clips</span><input id="search" type="search" placeholder="Search clips" autocomplete="off"></label></div>
<div class="grid" id="cards"></div><div class="empty" id="empty" hidden><p>No matches.</p><button id="reset" class="text-button">Clear filters</button></div>
</main>
<footer><span>Albi Prime</span><a href="/">AlbertoScott.co.uk</a></footer>
<dialog id="detail"><button class="close" aria-label="Close clip details">×</button><p class="eyebrow" id="detail-category"></p><h2 id="detail-title"></h2><dl></dl><p class="detail-note"></p><a class="primary download-link" hidden target="_blank" rel="noopener"></a><a class="source-link" target="_blank" rel="noopener"></a></dialog>
</body></html>
