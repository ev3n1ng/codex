<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>South East Store Visit Planner</title>
  <style>
    :root {
      --ink: #172233;
      --muted: #5f6b7a;
      --paper: #f7f4ee;
      --panel: #fffdf8;
      --line: #ded7c9;
      --blue: #1f5f85;
      --teal: #1e7b73;
      --green: #6d873c;
      --gold: #b5811e;
      --red: #ad4d43;
      --shadow: 0 18px 55px rgba(23, 34, 51, 0.12);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(31, 95, 133, 0.06) 1px, transparent 1px),
        linear-gradient(rgba(31, 95, 133, 0.04) 1px, transparent 1px),
        var(--paper);
      background-size: 34px 34px;
      font-family: Avenir Next, Avenir, Segoe UI, Helvetica Neue, sans-serif;
    }

    a { color: inherit; }

    .shell {
      width: min(1380px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 46px;
    }

    header {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, Cambria, serif;
      font-size: clamp(34px, 5vw, 66px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .intro {
      margin: 12px 0 0;
      max-width: 760px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .field {
      min-width: 230px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: var(--ink);
      font-size: 14px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset;
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      gap: 8px;
      padding: 10px 0;
      margin: 0 0 14px;
      background: rgba(247, 244, 238, 0.94);
      backdrop-filter: blur(10px);
      overflow-x: auto;
    }

    .tab {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab[aria-selected="true"] {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin: 0 0 18px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 7px 24px rgba(23, 34, 51, 0.06);
    }

    .stat b {
      display: block;
      font-size: 27px;
      line-height: 1;
      margin-bottom: 6px;
      font-family: Georgia, Cambria, serif;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
      animation: rise 220ms ease-out;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .week-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 10px 0 14px;
    }

    .week-head h2 {
      margin: 0;
      font-family: Georgia, Cambria, serif;
      font-size: 32px;
      letter-spacing: 0;
    }

    .week-head p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .days {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }

    .day {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .day-title {
      padding: 12px 13px;
      border-bottom: 1px solid var(--line);
      background: #fff8e8;
    }

    .day-title h3 {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 0;
      font-size: 17px;
    }

    .day-title small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      line-height: 1.25;
      min-height: 32px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--ink);
      color: white;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .distance {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 13px;
      font-size: 13px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }

    .distance strong {
      color: var(--teal);
      font-size: 18px;
    }

    .stops {
      display: grid;
      gap: 0;
      padding: 0;
    }

    .stop {
      padding: 13px;
      border-bottom: 1px solid var(--line);
    }

    .stop:last-child { border-bottom: 0; }

    .stop-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
    }

    .stop-num {
      display: inline-grid;
      place-items: center;
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      font-weight: 900;
      font-size: 13px;
    }

    .store {
      margin: 0;
      font-weight: 900;
      line-height: 1.18;
    }

    .retailer {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .postcode {
      display: inline-block;
      margin-top: 9px;
      padding: 7px 9px;
      border: 1px solid #c7d6dc;
      border-radius: 7px;
      color: var(--blue);
      background: #eef7fa;
      font-weight: 900;
      text-decoration: none;
    }

    .meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .chip {
      border-radius: 999px;
      padding: 4px 8px;
      background: #f0eee7;
      color: #49515c;
      font-size: 12px;
      font-weight: 800;
    }

    .chip.attack { background: #ffe5df; color: var(--red); }
    .chip.defend { background: #fff0ca; color: #8a5d05; }
    .chip.sd { background: #e7f1ff; color: var(--blue); }
    .chip.maintain { background: #e8f4e4; color: var(--green); }

    .map-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .map-wrap iframe {
      width: 100%;
      min-height: 72vh;
      border: 0;
      border-radius: var(--radius);
    }

    .route-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .route-table th,
    .route-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    .route-table th {
      background: #fff8e8;
      color: var(--ink);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .empty {
      padding: 32px;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .note {
      margin-top: 18px;
      padding: 14px 16px;
      border-left: 4px solid var(--gold);
      background: rgba(255, 248, 232, 0.86);
      color: #4b4233;
      line-height: 1.4;
    }

    @media (max-width: 1180px) {
      header { grid-template-columns: 1fr; }
      .toolbar { justify-content: flex-start; }
      .days { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 700px) {
      .shell { width: min(100% - 20px, 1380px); padding-top: 18px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .days { grid-template-columns: 1fr; }
      .week-head { display: block; }
      .route-table { display: block; overflow-x: auto; }
      h1 { font-size: 38px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>South East Store Visit Planner</h1>
        <p class="intro">Six-week weekday dashboard with a maximum of 3 visits per day. Any wider route is kept to 2 stops, all postcode links open Google Maps, and the full store map sits in its own tab.</p>
      </div>
      <div class="toolbar">
        <input class="field" id="search" type="search" placeholder="Search store, area, postcode..." />
        <select class="field" id="statusFilter" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="Attack">Attack</option>
          <option value="Defend">Defend</option>
          <option value="SD">SD</option>
          <option value="Maintain">Maintain</option>
          <option value="Low value/volume">Low value/volume</option>
        </select>
      </div>
    </header>

    <section class="stats" aria-label="Planner summary">
      <div class="stat"><b>79</b><span>Planned visits</span></div>
      <div class="stat"><b>55</b><span>Stores visited</span></div>
      <div class="stat"><b>3</b><span>Max stops/day</span></div>
      <div class="stat"><b>19.0</b><span>Max road miles</span></div>
      <div class="stat"><b>90</b><span>6-week capacity</span></div>
    </section>

    <nav class="tabs" aria-label="Dashboard tabs" id="tabs"></nav>
    <section id="panels"></section>
  </main>

ons are scheduled in weeks 1-6; the remainder should land in weeks 7-13."], ["Frequency 0", "Not scheduled unless business priorities change."]]}</script>
  <script>
    const data = JSON.parse(document.getElementById("planner-data").textContent);
    const weekdays = ["Mon", "Tue", "Wed", "Thu", "Fri"];
    const tabs = document.getElementById("tabs");
    const panels = document.getElementById("panels");
    const search = document.getElementById("search");
    const statusFilter = document.getElementById("statusFilter");
    const mapIframe = `<iframe src="https://www.google.com/maps/d/u/0/embed?mid=1_Jq5dx8BB-6JkWoD0-6pjekHDgc19q8&ehbc=2E312F" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>`;

    function mapUrl(row) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${row["Store Name"]} ${row.Postcode}`)}`;
    }

    function chipClass(status) {
      return String(status || "").toLowerCase().replaceAll(" ", "-").replaceAll("/", "-");
    }

    function matches(row) {
      const q = search.value.trim().toLowerCase();
      const status = statusFilter.value;
      const text = [row["Store Name"], row.Retailer, row.Postcode, row["Area Focus"], row.Status].join(" ").toLowerCase();
      return (!q || text.includes(q)) && (!status || row.Status === status);
    }

    function rowsForDay(week, weekday) {
      return data.plannerRows.filter(row => row.Week === week && row.Weekday === weekday && matches(row));
    }

    function dayInfo(week, weekday) {
      return data.dayRows.find(row => row.Week === week && row.Weekday === weekday);
    }

    function renderStop(row) {
      const status = htmlEscape(row.Status || "");
      return `<article class="stop">
        <div class="stop-top">
          <div>
            <p class="store">${htmlEscape(row["Store Name"])}</p>
            <div class="retailer">${htmlEscape(row.Retailer)} · ${htmlEscape(row["Area Focus"])}</div>
          </div>
          <span class="stop-num">${row.Stop}</span>
        </div>
        <a class="postcode" href="${mapUrl(row)}" target="_blank" rel="noopener">${htmlEscape(row.Postcode)}</a>
        <div class="meta">
          <span class="chip ${chipClass(status)}">${status}</span>
          <span class="chip">Freq ${row["Quarterly Frequency"]}/qtr</span>
          <span class="chip">Visit ${row["Visit # in First 6 Weeks"]}</span>
        </div>
      </article>`;
    }

    function htmlEscape(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function renderWeek(week) {
      const totalStops = data.plannerRows.filter(row => row.Week === week && matches(row)).length;
      const maxMiles = Math.max(...data.dayRows.filter(row => row.Week === week).map(row => row["Max Road Miles"]));
      const dayCards = weekdays.map(day => {
        const info = dayInfo(week, day);
        const rows = rowsForDay(week, day);
        return `<section class="day">
          <div class="day-title">
            <h3>${day} <span class="badge">${rows.length} stop${rows.length === 1 ? "" : "s"}</span></h3>
            <small>${htmlEscape(info["Area Focus"])}</small>
          </div>
          <div class="distance"><span>Road spread</span><strong>${Number(info["Max Road Miles"]).toFixed(1)} mi</strong></div>
          <div class="stops">${rows.length ? rows.map(renderStop).join("") : `<div class="empty">No matching stops for this filter.</div>`}</div>
        </section>`;
      }).join("");
      return `<section class="panel" id="week-${week}" data-tab-title="Week ${week}">
        <div class="week-head">
          <div>
            <h2>Week ${week}</h2>
            <p>${totalStops} visible visits · widest route ${Number(maxMiles).toFixed(1)} miles</p>
          </div>
        </div>
        <div class="days">${dayCards}</div>
      </section>`;
    }

    function renderOverview() {
      const rows = data.dayRows.map(row => `<tr>
        <td>Week ${row.Week}</td>
        <td>${htmlEscape(row.Weekday)}</td>
        <td>${htmlEscape(row["Area Focus"])}</td>
        <td>${row.Stops}</td>
        <td>${Number(row["Max Road Miles"]).toFixed(1)} mi</td>
        <td>${htmlEscape(row["Route Summary"])}</td>
      </tr>`).join("");
      return `<section class="panel active" id="overview" data-tab-title="Overview">
        <div class="week-head">
          <div>
            <h2>Route Overview</h2>
            <p>Every day is capped at 3 stops. Wider routes are held to 2 stops, with the largest current spread at ${Number(data.summary.maxRoadMiles).toFixed(1)} road miles.</p>
          </div>
        </div>
        <table class="route-table">
          <thead><tr><th>Week</th><th>Day</th><th>Area</th><th>Stops</th><th>Miles</th><th>Route</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="note">The original call file requests ${data.summary.quarterRequired} visits per quarter. At 3 visits per weekday, a 13-week quarter can hold ${data.summary.quarterCapacity} visits, so lower-frequency Maintain visits are flagged in the coverage workbook for later scheduling or cadence review.</div>
      </section>`;
    }

    function renderMap() {
      return `<section class="panel" id="map" data-tab-title="Store Map">
        <div class="week-head">
          <div>
            <h2>Store Map</h2>
            <p>Embedded store map for the South East route area.</p>
          </div>
        </div>
        <div class="map-wrap">${mapIframe}</div>
      </section>`;
    }

    function render() {
      const current = document.querySelector(".tab[aria-selected='true']")?.dataset.target || "overview";
      panels.innerHTML = renderOverview() + [1, 2, 3, 4, 5, 6].map(renderWeek).join("") + renderMap();
      tabs.innerHTML = [...panels.querySelectorAll(".panel")].map(panel => `<button class="tab" type="button" data-target="${panel.id}" aria-selected="${panel.id === current}">${panel.dataset.tabTitle}</button>`).join("");
      const activePanel = document.getElementById(current) || document.getElementById("overview");
      document.querySelectorAll(".panel").forEach(panel => panel.classList.toggle("active", panel === activePanel));
      tabs.querySelectorAll(".tab").forEach(button => {
        button.addEventListener("click", () => {
          tabs.querySelectorAll(".tab").forEach(tab => tab.setAttribute("aria-selected", "false"));
          button.setAttribute("aria-selected", "true");
          document.querySelectorAll(".panel").forEach(panel => panel.classList.toggle("active", panel.id === button.dataset.target));
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    search.addEventListener("input", render);
    statusFilter.addEventListener("change", render);
    render();
  </script>
