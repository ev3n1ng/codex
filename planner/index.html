<html lang="en">

<title>South East Territory Dashboard — 6-Week Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151c; --panel:#1b2029; --bezel:#282f3c; --line:#333c4c;
    --amber:#e8a33d; --teal:#4fd1c5; --text:#edeef0; --text-dim:#9aa3b5; --text-faint:#5c6478;
    --attack:#e2574c; --defend:#e8a33d; --sd:#4fd1c5; --maintain:#7089ad; --low:#5b6270;
    --radius:14px;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:radial-gradient(ellipse at 20% -10%, #1c2230 0%, transparent 55%),
      radial-gradient(ellipse at 100% 0%, #1a2430 0%, transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding:20px 16px 60px;}
  .wrap{max-width:960px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--amber),#c97f1f);
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono';font-weight:700;color:#1a1400;font-size:13px;
    box-shadow:0 0 0 1px #ffffff22 inset, 0 4px 10px #00000055;}
  .brand h1{font-family:'Space Grotesk';font-size:16px;margin:0;letter-spacing:.02em;font-weight:600;}
  .brand p{margin:1px 0 0;font-size:11.5px;color:var(--text-dim);font-family:'JetBrains Mono';letter-spacing:.03em;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--panel);padding:6px;border-radius:12px;
    border:1px solid var(--line);margin-bottom:20px;}
  .tab{appearance:none;border:none;cursor:pointer;background:transparent;color:var(--text-dim);
    font-family:'Space Grotesk';font-size:13px;font-weight:600;padding:9px 14px;border-radius:8px;
    transition:background .15s,color .15s;white-space:nowrap;}
  .tab:hover{color:var(--text);} .tab.active{background:var(--amber);color:#1a1400;}
  .panel{display:none;} .panel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .card{background:linear-gradient(180deg,var(--panel),#171b23);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;box-shadow:0 0 0 1px #00000040 inset, 0 8px 24px -12px #00000090;margin-bottom:16px;}
  .card h2{font-family:'Space Grotesk';font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    color:var(--text-dim);margin:0 0 14px;}
  .gauge-row{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  @media(max-width:640px){.gauge-row{grid-template-columns:1fr;}}
  .gauge-wrap{display:flex;flex-direction:column;align-items:center;}
  .readout{font-family:'JetBrains Mono';font-weight:700;font-size:42px;color:var(--amber);
    text-shadow:0 0 18px #e8a33d55;margin-top:-64px;letter-spacing:-1px;}
  .readout small{font-size:16px;color:var(--text-dim);font-weight:600;margin-left:2px;}
  .gauge-label{font-size:12px;color:var(--text-dim);margin-top:2px;font-family:'JetBrains Mono';letter-spacing:.03em;}
  .mini-gauges{display:flex;gap:14px;}
  .mini-gauge{flex:1;background:var(--bezel);border-radius:10px;padding:14px;border:1px solid var(--line);text-align:center;}
  .mini-gauge .num{font-family:'JetBrains Mono';font-size:24px;font-weight:700;color:var(--teal);}
  .mini-gauge .lbl{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;font-family:'Space Grotesk';}
  .multi-list{display:flex;flex-direction:column;gap:7px;}
  .multi-item{display:flex;align-items:center;justify-content:space-between;background:var(--bezel);border-radius:9px;
    padding:9px 13px;border:1px solid var(--line);cursor:pointer;}
  .multi-item .nm{font-size:12.5px;font-weight:600;}
  .multi-item .sub{font-family:'JetBrains Mono';font-size:10.5px;color:var(--text-dim);margin-top:1px;}
  .multi-item .cnt{font-family:'Space Grotesk';font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;
    color:#0d0f13;flex-shrink:0;}
  .week-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;flex-wrap:wrap;gap:6px;}
  .week-head h2{font-family:'Space Grotesk';font-size:19px;margin:0;font-weight:600;}
  .week-head .meta{font-family:'JetBrains Mono';font-size:12px;color:var(--text-dim);}
  .day-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .day-strip{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bezel);border-bottom:1px solid var(--line);}
  .day-strip .dname{font-family:'Space Grotesk';font-weight:600;font-size:13px;}
  .day-strip .dname span{color:var(--text-dim);font-weight:500;margin-left:6px;}
  .day-strip .dmiles{font-family:'JetBrains Mono';font-size:11px;color:var(--text-dim);}
  .store-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #ffffff0d;}
  .store-row:last-child{border-bottom:none;}
  .chk{width:21px;height:21px;flex-shrink:0;border-radius:6px;border:2px solid var(--text-faint);cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:#00000030;transition:.15s;}
  .chk.checked{background:var(--teal);border-color:var(--teal);box-shadow:0 0 10px #4fd1c566;}
  .chk svg{width:13px;height:13px;stroke:#0d0f13;stroke-width:3;fill:none;opacity:0;transition:.15s;}
  .chk.checked svg{opacity:1;}
  .store-info{flex:1;min-width:0;}
  .store-info .nm{font-size:14px;font-weight:600;}
  .store-info.done .nm{color:var(--text-faint);text-decoration:line-through;}
  .store-info .meta{font-family:'JetBrains Mono';font-size:11px;color:var(--text-dim);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
  .visit-tag{font-family:'Space Grotesk';font-size:9.5px;font-weight:700;color:var(--teal);border:1px solid var(--teal);
    padding:1px 6px;border-radius:20px;text-transform:uppercase;}
  footer{text-align:center;color:var(--text-faint);font-size:11px;margin-top:28px;font-family:'JetBrains Mono';}
</style>
</head>

const STATUS_COLORS = {'Attack':'var(--attack)','Defend':'var(--defend)','SD':'var(--sd)','Maintain':'var(--maintain)','Low value/volume':'var(--low)'};

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
const weeks = [1,2,3,4,5,6];

const qBtn = mkTab('Overview','q', true);
tabsEl.appendChild(qBtn);
weeks.forEach(w => tabsEl.appendChild(mkTab('Week '+w, 'w'+w, false)));

function mkTab(label,key,active){
  const b=document.createElement('button');
  b.className='tab'+(active?' active':''); b.textContent=label; b.dataset.key=key;
  b.onclick=()=>switchTab(key); return b;
}
function switchTab(key){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.key===key));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.dataset.key===key));
}
window.switchTab = switchTab;

let checked = {};
async function loadState(){
  try{
    if(window.storage){
      const res=await window.storage.get('sixwk-checklist-v2', false);
      if(res&&res.value) checked=JSON.parse(res.value);
    }else{
      checked=JSON.parse(localStorage.getItem('sixwk-checklist-v2') || '{}');
    }
  }catch(e){checked={};}
}
async function saveState(){
  try{
    if(window.storage){
      await window.storage.set('sixwk-checklist-v2', JSON.stringify(checked), false);
    }else{
      localStorage.setItem('sixwk-checklist-v2', JSON.stringify(checked));
    }
  }catch(e){}
}

function buildQuarterPanel(){
  const div=document.createElement('div'); div.className='panel'; div.dataset.key='q';
  const firstVisits = DATA.filter(d=>d.visitNum===1);
  const doneFirst = firstVisits.filter(d=>checked[d.id]).length;
  const pct = Math.round((doneFirst/firstVisits.length)*100);
  const multiStores = [...new Map(DATA.filter(d=>d.totalVisits>1).map(d=>[d.idx,d])).values()];
  const doneMultiVisits = DATA.filter(d=>d.totalVisits>1 && checked[d.id]).length;
  const totalMultiVisits = DATA.filter(d=>d.totalVisits>1).length;

  let multiHTML = multiStores.map(s=>{
    const doneCount = DATA.filter(d=>d.idx===s.idx && checked[d.id]).length;
    return `<div class="multi-item" onclick="jumpToFirst(${s.idx})">
      <div><div class="nm">${s.store}</div><div class="sub">${s.retailer} &middot; ${s.postcode} &middot; ${s.status} &middot; ${s.freqQtr}x/qtr target</div></div>
      <div class="cnt" style="background:${STATUS_COLORS[s.status]}">${doneCount}/${s.totalVisits} seen</div>
    </div>`;
  }).join('');

  div.innerHTML = `
    <div class="gauge-row">
      <div class="card">
        <h2>Territory Coverage — First Visits</h2>
        <div class="gauge-wrap">
          <svg width="220" height="160" viewBox="0 0 220 160">
            <path d="M 30 140 A 80 80 0 1 1 190 140" fill="none" stroke="#282f3c" stroke-width="14" stroke-linecap="round"/>
            <path d="M 30 140 A 80 80 0 1 1 190 140" fill="none" stroke="var(--amber)" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="${(pct/100)*377} 377" style="filter:drop-shadow(0 0 6px #e8a33d88)"/>
          </svg>
          <div class="readout">${doneFirst}<small>/${firstVisits.length}</small></div>
          <div class="gauge-label">STORES VISITED &middot; ${pct}%</div>
        </div>
        <div class="mini-gauges" style="margin-top:16px;">
          <div class="mini-gauge"><div class="num">${firstVisits.length-doneFirst}</div><div class="lbl">Still To Do</div></div>
          <div class="mini-gauge"><div class="num" style="color:var(--attack)">${doneMultiVisits}/${totalMultiVisits}</div><div class="lbl">Priority Revisits</div></div>
        </div>
      </div>
      <div class="card">
        <h2>Stores Seen More Than Once (${multiStores.length})</h2>
        <p style="font-size:11.5px;color:var(--text-dim);margin:0 0 12px;line-height:1.5;">
          These 7 Attack (6x/qtr) and 9 Defend (4x/qtr) stores get a 2nd visit within this 6-week window,
          on pace for their required quarterly frequency.
        </p>
        <div class="multi-list">${multiHTML}</div>
      </div>
    </div>
  `;
  return div;
}

function buildWeekPanel(week){
  const div=document.createElement('div'); div.className='panel'; div.dataset.key='w'+week;
  const rows = DATA.filter(d=>d.week===week);
  const days = [...new Set(rows.map(r=>r.dayNum))].sort((a,b)=>a-b);
  const totalMiles = rows.reduce((s,r)=>s+r.miles,0);
  const doneCount = rows.filter(r=>checked[r.id]).length;

  let dayBlocks='';
  days.forEach(dn=>{
    const dayRows = rows.filter(r=>r.dayNum===dn);
    const dname = dayRows[0].day;
    const miles = dayRows.reduce((s,r)=>s+r.miles,0);
    let storesHTML='';
    dayRows.forEach(r=>{
      const isChecked = !!checked[r.id];
      storesHTML += `
        <div class="store-row">
          <div class="chk ${isChecked?'checked':''}" data-id="${r.id}"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
          <div class="store-info ${isChecked?'done':''}">
            <div class="nm">${r.store} ${r.totalVisits>1 ? `<span class="visit-tag">visit ${r.visitNum} of ${r.totalVisits}</span>` : ''}</div>
            <div class="meta"><span>${r.retailer}</span><span>${r.postcode}</span><span>${r.miles}mi</span>
              <span style="color:${STATUS_COLORS[r.status]}">${r.status}</span></div>
          </div>
        </div>`;
    });
    dayBlocks += `
      <div class="day-block">
        <div class="day-strip"><div class="dname">Day ${dn} <span>${dname}</span></div>
        <div class="dmiles">~${Math.round(miles)}mi one-way total</div></div>
        ${storesHTML}
      </div>`;
  });

  div.innerHTML = `
    <div class="week-head"><h2>Week ${week}</h2>
      <div class="meta">${doneCount}/${rows.length} done &middot; ~${Math.round(totalMiles)} miles one-way across the week</div></div>
    ${dayBlocks}
  `;
  return div;
}

function renderAll(){
  panelsEl.innerHTML='';
  panelsEl.appendChild(buildQuarterPanel());
  weeks.forEach(w=>panelsEl.appendChild(buildWeekPanel(w)));
  const activeKey = document.querySelector('.tab.active')?.dataset.key || 'q';
  switchTab(activeKey);
  attachCheckboxHandlers();
}
function attachCheckboxHandlers(){
  document.querySelectorAll('.chk').forEach(el=>{
    el.onclick = async ()=>{ const id=el.dataset.id; checked[id]=!checked[id]; await saveState(); renderAll(); };
  });
}
window.jumpToFirst = function(idx){
  const row = DATA.find(d=>d.idx===idx);
  if(row) switchTab('w'+row.week);
};

(async function init(){ await loadState(); renderAll(); })();
</script>
</body>
</html>
